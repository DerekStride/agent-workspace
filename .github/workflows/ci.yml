name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extensions:
    name: OMP and Pi extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test OMP adapter
        run: bun run test:omp

      - name: Test Pi adapter
        run: bun run test:pi
